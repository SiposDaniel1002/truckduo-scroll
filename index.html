<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Truck Duo | Kamion, Utánfutó és Jármű Alkatrészek Békéscsabán</title>
    <meta
      name="description"
      content="Kamion alkatrész, utánfutó kiegészítők és Simson alkatrészek Békéscsabán. A Truck Duo Kft. jármű alkatrészeket és kenőanyagokat kínál Békés megyében."
    />
    <!-- Production origin. It is written out in full here and in robots.txt / sitemap.xml, the
         three static files that need an absolute URL; everything else uses relative paths.
         The site answers on www too, so the canonical keeps search engines on the apex. -->
    <link rel="canonical" href="https://truckduo.hu/" />

    <!-- Open Graph: how the page looks when the shop's Facebook page links to it. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://truckduo.hu/" />
    <meta property="og:site_name" content="Truck Duo Kft." />
    <meta property="og:locale" content="hu_HU" />
    <!-- Kept identical to <title> and <meta name="description"> above. -->
    <meta property="og:title" content="Truck Duo | Kamion, Utánfutó és Jármű Alkatrészek Békéscsabán" />
    <meta
      property="og:description"
      content="Kamion alkatrész, utánfutó kiegészítők és Simson alkatrészek Békéscsabán. A Truck Duo Kft. jármű alkatrészeket és kenőanyagokat kínál Békés megyében."
    />
    <meta property="og:image" content="https://truckduo.hu/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Truck Duo — kamion alkatrészek Békéscsabán" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- "td" in the logo's Montserrat Black, as outlined paths (favicons can't load web fonts).
         sizes on the PNG keeps browsers that support SVG from preferring the bitmap. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The first hero photo is the Largest Contentful Paint element, but React only creates
         its <img> after the script runs; preloading lets the download start with the HTML.
         imagesrcset/imagesizes must stay identical to that <img>'s srcset/sizes
         (src/data/categories.ts, photoSizes in ScrollCarousel.tsx) or the photo downloads twice.
         No href, so browsers without imagesrcset skip the preload instead of guessing a width. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/src/assets/kamion-pic-640.webp 640w, /src/assets/kamion-pic-1024.webp 1024w, /src/assets/kamion-pic-1440.webp 1440w, /src/assets/kamion-pic.webp 1920w"
      imagesizes="(max-width: 767px) calc(50vh * 1.333), calc(80vh * 1.333)"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
